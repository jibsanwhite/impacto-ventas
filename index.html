<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IMPACTO · Catálogo para gestores</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --primary:#15803D;
    --on-primary:#FFFFFF;
    --accent:#0369A1;
    --on-accent:#FFFFFF;
    --bg:#F0FDF4;
    --fg:#14532D;
    --card:#FFFFFF;
    --muted:#E8F0F1;
    --muted-fg:#475569;
    --border:#BBF7D0;
    --destructive:#DC2626;
    --ink:#0F172A;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--fg);-webkit-text-size-adjust:100%}
  header{background:var(--fg);color:var(--on-primary);padding:20px 16px 18px}
  header h1{font-size:28px;font-weight:800;letter-spacing:.5px}
  header p{font-size:13px;color:var(--border);margin-top:6px}
  .fecha{background:var(--card);padding:11px 16px;font-size:13px;color:var(--muted-fg);border-bottom:1px solid var(--border)}
  .fecha b{color:var(--fg)}
  main{padding:12px 16px 24px;max-width:640px;margin:0 auto}
  .buscador{width:100%;height:44px;border:1.5px solid var(--border);border-radius:10px;padding:0 14px;font-size:14px;font-family:inherit;background:var(--card);color:var(--fg);outline:none}
  .buscador:focus{border-color:var(--primary)}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:12px 2px 4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;height:44px;padding:0 16px;border-radius:22px;border:1.5px solid var(--border);background:var(--card);color:var(--fg);font-size:13px;font-family:inherit;cursor:pointer}
  .chip.activo{background:var(--primary);border-color:var(--primary);color:var(--on-primary);font-weight:600}
  .tarjeta{background:var(--card);border:1.5px solid var(--border);border-radius:14px;overflow:hidden;margin-top:12px}
  .tarjeta img.foto{display:block;width:100%;height:230px;object-fit:cover;object-position:center 30%;background:var(--muted)}
  .foto-vacia{height:170px;background:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted-fg);gap:6px}
  .foto-vacia b{font-size:15px}
  .foto-vacia span{font-size:12px}
  .cuerpo{padding:14px 14px 16px}
  .cuerpo h2{font-size:18px;font-weight:700;color:var(--fg)}
  .tarjeta.vendida .cuerpo h2,.tarjeta.vendida .precio{color:var(--muted-fg);text-decoration:line-through}
  .fila-precio{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
  .precio{font-size:24px;font-weight:800;color:var(--primary)}
  .precio small{font-size:13px;font-weight:600}
  .estado{font-size:12px;font-weight:700;padding:6px 12px;border-radius:13px;white-space:nowrap}
  .estado.disponible{background:var(--primary);color:var(--on-primary)}
  .estado.vendido{background:var(--destructive);color:#fff}
  .meta{font-size:13px;color:var(--muted-fg);margin-top:10px;line-height:1.5}
  .link-detalles{display:inline-block;margin-top:10px;font-size:13px;font-weight:700;color:var(--accent);background:none;border:none;padding:0;font-family:inherit;cursor:pointer}
  .acciones{display:flex;gap:8px;margin-top:14px}
  .acciones button{flex:1;height:46px;border-radius:10px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer}
  .btn-copiar{background:var(--accent);color:var(--on-accent);border:none}
  .btn-vendido{background:var(--card);color:var(--destructive);border:1.5px solid var(--destructive)}
  .btn-copiar:disabled{background:var(--muted);color:var(--muted-fg);cursor:default}
  .btn-compartir{width:100%;height:46px;border-radius:10px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;background:var(--primary);color:var(--on-primary);border:none;margin-top:8px}
  .btn-compartir:disabled{background:var(--muted);color:var(--muted-fg);cursor:default}
  .btn-pedir{display:block;width:100%;height:48px;border-radius:10px;font-size:15px;font-weight:800;font-family:inherit;cursor:pointer;background:var(--primary);color:var(--on-primary);border:none;margin-top:8px;text-align:center;line-height:48px;text-decoration:none}
  .btn-pedir.deshabilitado{background:var(--muted);color:var(--muted-fg);pointer-events:none}
  .aviso{font-size:12px;color:var(--muted-fg);background:var(--muted);border-radius:8px;padding:10px 12px;margin-top:10px;line-height:1.5}
  .vacio{text-align:center;color:var(--muted-fg);padding:36px 16px;font-size:14px;line-height:1.6}
  footer{text-align:center;color:var(--muted-fg);font-size:12px;line-height:1.7;padding:18px 16px 8px}
  .ref{position:relative}
  .ref .chip-foto{position:absolute;left:10px;bottom:10px;background:var(--ink);color:#fff;font-size:11px;font-weight:700;padding:5px 10px;border-radius:11px}
  /* Modal de detalles */
  .modal-fondo{position:fixed;inset:0;background:rgba(15,23,42,.6);display:none;align-items:flex-end;justify-content:center;z-index:50}
  .modal-fondo.abierto{display:flex}
  .modal{background:var(--card);width:100%;max-width:640px;max-height:88vh;overflow-y:auto;border-radius:16px 16px 0 0;padding:0 0 20px}
  .modal img.foto{display:block;width:100%;height:230px;object-fit:cover;object-position:center 30%;background:var(--muted)}
  .modal .cuerpo h2{font-size:20px}
  .modal h3{font-size:14px;font-weight:700;color:var(--fg);margin:14px 0 6px}
  .modal ul{list-style:none}
  .modal ul li{font-size:13px;color:var(--muted-fg);line-height:1.6;padding-left:14px;position:relative}
  .modal ul li:before{content:"•";position:absolute;left:0;color:var(--primary)}
  .tabla-prov{width:100%;border-collapse:collapse;margin-top:4px}
  .tabla-prov th,.tabla-prov td{font-size:13px;text-align:left;padding:8px 4px;border-bottom:1px solid var(--muted)}
  .tabla-prov th{color:var(--muted-fg);font-weight:600}
  .tabla-prov td.precio-celda{font-weight:700;color:var(--primary);white-space:nowrap}
  .tabla-prov .agotado-celda{color:var(--destructive);font-weight:700;font-size:12px}
  .tabla-prov .disp-celda{color:var(--primary);font-weight:700;font-size:12px}
  .btn-cerrar{width:100%;height:46px;border-radius:10px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;background:var(--muted);color:var(--muted-fg);border:none;margin-top:8px}
</style>
</head>
<body>
<header>
  <h1>IMPACTO</h1>
  <p>Catálogo para gestores · Ofertas de la comunidad</p>
</header>
<div class="fecha"><span id="fecha">Hoy</span> · <b id="conteo"></b></div>
<main>
  <input class="buscador" id="buscador" type="search" placeholder="Buscar producto…" aria-label="Buscar producto">
  <div class="chips" id="chips"></div>
  <div id="lista"></div>
</main>
<footer>
  Resumen diario · Se actualiza cada noche a las 8:00<br>
  La foto es referencial, no es la del vendedor.
</footer>

<div class="modal-fondo" id="modal-fondo">
  <div class="modal" id="modal"></div>
</div>

<script>
const GRUPOS = ["COCINAS","ENERGÍA","LAVADORAS","TV","HORNOS","NEVERAS","REFRIGERADORES","SPLITS","BOCINAS","CAJITAS","FREIDORAS","OLLAS","VENTILADORES","LICUADORAS","BASES","CAFETERAS","LUMINARIA","COLCHONES","TRANSPORTE","OTROS"];
let ofertas = [];
let grupoActivo = "Todos";
let textoBusqueda = "";
let API_URL = "";
let WHATSAPP_PEDIDOS = "+5358559794";

function fechaHoy(){
  try{
    return new Date().toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  }catch(e){ return ""; }
}
document.getElementById('fecha').textContent = fechaHoy();

function llamarAPI(accion, datos){
  datos = datos || {};
  datos.action = accion;
  return fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(datos),
    redirect: 'follow'
  }).then(function(r){ return r.json(); });
}

function normalizar(o, origen){
  if(origen === 'api'){
    var disp = (o.proveedores || []).filter(function(s){ return s.disponible; });
    var primero = disp[0] || (o.proveedores || [])[0] || {};
    var preciosDistintos = {};
    disp.forEach(function(s){ preciosDistintos[s.precio + ' ' + s.moneda] = true; });
    var texto = o.tipo + ' ' + o.modelo + ' / Precio: ' +
      (o.precio_desde !== null && o.precio_desde !== undefined ? o.precio_desde + ' ' + o.moneda : 'Consultar') +
      (primero.pago ? ' / Pago: ' + primero.pago : '') + ' / Foto de referencia';
    return {
      id: o.id, grupo: o.grupo, tipo: o.tipo, modelo: o.modelo,
      caracteristicas: o.caracteristicas || '',
      foto_url: o.foto_url || '', foto_tipo: o.foto_tipo || 'referencia',
      estado: o.estado, precio: o.precio_desde, moneda: o.moneda,
      multi: Object.keys(preciosDistintos).length > 1,
      pago: primero.pago || '', garantia: primero.garantia || '',
      domicilio: primero.domicilio || '',
      proveedores: o.proveedores || [], textoEstado: texto
    };
  }
  // origen ofertas.json (respaldo local)
  return {
    id: o.id, grupo: o.grupo, tipo: o.tipo, modelo: o.modelo,
    caracteristicas: '', foto_url: o.foto || '', foto_tipo: o.fotoReferencia ? 'referencia' : 'real',
    estado: o.estado, precio: o.precio, moneda: o.moneda,
    multi: false, pago: o.pago || '', garantia: o.garantia || '',
    domicilio: o.domicilio || '',
    proveedores: [{ proveedor: '', precio: o.precio, moneda: o.moneda,
      pago: o.pago || '', disponible: o.estado !== 'vendido',
      domicilio: o.domicilio || '', garantia: o.garantia || '' }],
    textoEstado: o.textoEstado || (o.tipo + ' ' + o.modelo + ' / Precio: ' + o.precio + ' ' + o.moneda)
  };
}

function proveedorMasBarato(o){
  var disp = (o.proveedores || []).filter(function(s){ return s.disponible; });
  if(!disp.length) disp = o.proveedores || [];
  if(!disp.length) return null;
  return disp.slice().sort(function(a,b){ return a.precio - b.precio; })[0];
}

function textoPedido(o){
  var s = proveedorMasBarato(o);
  var t = 'Hola, quiero comprar: ' + o.tipo + ' ' + o.modelo + ' — ' + o.precio + ' ' + o.moneda;
  if(s && s.proveedor) t += ' (Proveedor: ' + s.proveedor + ')';
  if(o.pago) t += ' — Pago: ' + o.pago;
  return t;
}

function pintarChips(){
  const cont = document.getElementById('chips');
  cont.innerHTML = "";
  ["Todos"].concat(GRUPOS).forEach(function(g){
    const b = document.createElement('button');
    b.className = 'chip' + (g === grupoActivo ? ' activo' : '');
    b.textContent = g.charAt(0) + g.slice(1).toLowerCase();
    b.onclick = function(){ grupoActivo = g; pintarChips(); pintarLista(); };
    cont.appendChild(b);
  });
}

function copiarTexto(btn, texto){
  function hecho(){ btn.textContent = "¡Copiado!"; setTimeout(function(){ btn.textContent = "Copiar texto"; }, 1800); }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(texto).then(hecho, function(){ respaldo(); });
  } else { respaldo(); }
  function respaldo(){
    const ta = document.createElement('textarea');
    ta.value = texto; document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); hecho(); }catch(e){}
    document.body.removeChild(ta);
  }
}

function compartirWhatsApp(btn, o){
  const textoOriginal = btn.textContent;
  function listo(msg){
    btn.textContent = msg;
    setTimeout(function(){ btn.textContent = textoOriginal; }, 2000);
  }
  if(navigator.share){
    (async function(){
      try{
        let files = [];
        if(o.foto_url){
          const resp = await fetch(o.foto_url, {mode: 'cors'});
          if(resp.ok){
            const blob = await resp.blob();
            const ext = (blob.type.split('/')[1] || 'jpg').split(';')[0];
            const file = new File([blob], 'foto.' + ext, {type: blob.type});
            if(!navigator.canShare || navigator.canShare({files: [file]})){ files = [file]; }
          }
        }
        const datos = {text: o.textoEstado};
        if(files.length){ datos.files = files; }
        await navigator.share(datos);
        listo('¡Compartido!');
      }catch(e){
        if(e && e.name === 'AbortError'){ return; }
        respaldo();
      }
    })();
    return;
  }
  respaldo();
  function respaldo(){
    if(o.foto_url){
      const card = btn.closest('.tarjeta');
      if(card && !card.querySelector('.aviso-foto')){
        const aviso = document.createElement('p');
        aviso.className = 'aviso aviso-foto';
        aviso.textContent = 'Se compartió solo el texto: la foto no se pudo leer desde su web. Guarda la foto con una pulsación larga y adjúntala en WhatsApp.';
        card.querySelector('.cuerpo').appendChild(aviso);
      }
    }
    window.open('https://wa.me/?text=' + encodeURIComponent(o.textoEstado), '_blank');
  }
}

function abrirDetalles(o){
  const fondo = document.getElementById('modal-fondo');
  const modal = document.getElementById('modal');
  const caracs = (o.caracteristicas || '').split(';').map(function(s){ return s.trim(); }).filter(function(s){ return s; });
  let filasProv = '';
  (o.proveedores || []).forEach(function(s){
    filasProv += '<tr><td>' + (s.proveedor || '—') + '</td>' +
      '<td class="precio-celda">' + s.precio + ' ' + s.moneda + '</td>' +
      '<td class="' + (s.disponible ? 'disp-celda' : 'agotado-celda') + '">' + (s.disponible ? 'DISPONIBLE' : 'AGOTADO') + '</td></tr>';
  });
  const fotoHtml = o.foto_url
    ? '<img class="foto" src="' + o.foto_url + '" alt="' + o.tipo + ' ' + o.modelo + '">'
    : '<div class="foto-vacia"><b>FOTO DE REFERENCIA</b><span>Aquí va la foto del producto</span></div>';
  const numero = WHATSAPP_PEDIDOS.replace(/[^0-9]/g, '');
  modal.innerHTML = fotoHtml +
    '<div class="cuerpo">' +
      '<h2>' + o.tipo + ' ' + o.modelo + '</h2>' +
      '<div class="fila-precio"><span class="precio">' + (o.multi ? '<small>desde</small> ' : '') + o.precio + ' ' + o.moneda + '</span>' +
      '<span class="estado ' + (o.estado === 'vendido' ? 'vendido' : 'disponible') + '">' + (o.estado === 'vendido' ? 'VENDIDO' : 'DISPONIBLE') + '</span></div>' +
      (caracs.length ? '<h3>Características</h3><ul>' + caracs.map(function(c){ return '<li>' + c + '</li>'; }).join('') + '</ul>' : '') +
      ((o.proveedores || []).length > 1 ? '<h3>Proveedores</h3><table class="tabla-prov"><tr><th>Proveedor</th><th>Precio</th><th></th></tr>' + filasProv + '</table>' : '') +
      (o.pago ? '<p class="meta">Pago: ' + o.pago + '</p>' : '') +
      (o.garantia ? '<p class="meta">Garantía: ' + o.garantia + '</p>' : '') +
      (o.domicilio ? '<p class="meta">Domicilio: ' + o.domicilio + '</p>' : '') +
      '<p class="meta">La foto es ' + (o.foto_tipo === 'real' ? 'del vendedor' : 'referencial, no es la del vendedor') + '.</p>' +
      (o.estado === 'vendido'
        ? '<a class="btn-pedir deshabilitado">Agotado</a>'
        : '<a class="btn-pedir" target="_blank" rel="noopener" href="https://wa.me/' + numero + '?text=' + encodeURIComponent(textoPedido(o)) + '">Pedir por WhatsApp</a>') +
      (o.estado === 'vendido' ? '' : '<button class="btn-compartir" id="modal-compartir">Compartir en WhatsApp</button>') +
      '<button class="btn-cerrar" id="modal-cerrar">Cerrar</button>' +
    '</div>';
  const btnC = modal.querySelector('#modal-compartir');
  if(btnC){ btnC.onclick = function(){ compartirWhatsApp(btnC, o); }; }
  modal.querySelector('#modal-cerrar').onclick = cerrarDetalles;
  fondo.classList.add('abierto');
}
function cerrarDetalles(){
  document.getElementById('modal-fondo').classList.remove('abierto');
}
document.getElementById('modal-fondo').addEventListener('click', function(e){
  if(e.target === this) cerrarDetalles();
});

function pintarLista(){
  const lista = document.getElementById('lista');
  lista.innerHTML = "";
  const q = textoBusqueda.trim().toLowerCase();
  const filtradas = ofertas.filter(function(o){
    if(grupoActivo !== "Todos" && o.grupo !== grupoActivo) return false;
    if(q && (o.tipo + " " + o.modelo + " " + o.grupo).toLowerCase().indexOf(q) === -1) return false;
    return true;
  });
  const disp = ofertas.filter(function(o){ return o.estado === "disponible"; }).length;
  document.getElementById('conteo').textContent = disp + (disp === 1 ? " oferta hoy" : " ofertas hoy");
  if(filtradas.length === 0){
    lista.innerHTML = '<div class="vacio">No hay ofertas en este grupo hoy.<br>El resumen se actualiza cada noche a las 8:00.</div>';
    return;
  }
  filtradas.forEach(function(o){
    const card = document.createElement('article');
    card.className = 'tarjeta' + (o.estado === "vendido" ? ' vendida' : '');
    let fotoHtml = "";
    if(o.foto_url){
      fotoHtml = '<div class="ref"><img class="foto" src="' + o.foto_url + '" alt="' + o.tipo + ' ' + o.modelo + '" loading="lazy"><span class="chip-foto">' + (o.foto_tipo === 'real' ? 'FOTO DEL VENDEDOR' : 'FOTO DE REFERENCIA') + '</span></div>';
    } else {
      fotoHtml = '<div class="foto-vacia"><b>FOTO DE REFERENCIA</b><span>Aquí va la foto del producto</span></div>';
    }
    const meta = [];
    if(o.pago) meta.push("Pago: " + o.pago);
    const det = [];
    if(o.garantia) det.push("Garantía: " + o.garantia);
    if(o.domicilio) det.push("Domicilio " + o.domicilio);
    if(det.length) meta.push(det.join(" · "));
    const numero = WHATSAPP_PEDIDOS.replace(/[^0-9]/g, '');
    card.innerHTML = fotoHtml +
      '<div class="cuerpo">' +
        '<h2>' + o.tipo + ' ' + o.modelo + '</h2>' +
        '<div class="fila-precio"><span class="precio">' + (o.multi ? '<small>desde</small> ' : '') + o.precio + ' ' + o.moneda + '</span>' +
        '<span class="estado ' + (o.estado === "vendido" ? "vendido" : "disponible") + '">' + (o.estado === "vendido" ? "VENDIDO" : "DISPONIBLE") + '</span></div>' +
        meta.map(function(m){ return '<p class="meta">' + m + '</p>'; }).join('') +
        '<button class="link-detalles">Ver detalles →</button>' +
        '<div class="acciones">' +
          '<button class="btn-copiar"' + (o.estado === "vendido" ? ' disabled' : '') + '>Copiar texto</button>' +
          (o.estado === "vendido" ? '' : '<button class="btn-vendido">Marcar vendido</button>') +
        '</div>' +
        '<button class="btn-compartir"' + (o.estado === "vendido" ? ' disabled' : '') + '>Compartir en WhatsApp</button>' +
        (o.estado === "vendido"
          ? '<a class="btn-pedir deshabilitado">Agotado</a>'
          : '<a class="btn-pedir" target="_blank" rel="noopener" href="https://wa.me/' + numero + '?text=' + encodeURIComponent(textoPedido(o)) + '">Pedir por WhatsApp</a>') +
      '</div>';
    const im = card.querySelector('img.foto');
    if(im){
      im.onerror = function(){
        const ref = im.closest('.ref');
        const ph = document.createElement('div');
        ph.className = 'foto-vacia';
        ph.innerHTML = '<b>FOTO DE REFERENCIA</b><span>Aquí va la foto del producto</span>';
        ref.replaceWith(ph);
      };
    }
    card.querySelector('.link-detalles').onclick = function(){ abrirDetalles(o); };
    const btnCopiar = card.querySelector('.btn-copiar');
    if(btnCopiar && o.estado !== "vendido"){
      btnCopiar.onclick = function(){ copiarTexto(btnCopiar, o.textoEstado); };
    }
    const btnCompartir = card.querySelector('.btn-compartir');
    if(btnCompartir && o.estado !== "vendido"){
      btnCompartir.onclick = function(){ compartirWhatsApp(btnCompartir, o); };
    }
    const btnVendido = card.querySelector('.btn-vendido');
    if(btnVendido){
      btnVendido.onclick = function(){
        if(card.querySelector('.aviso-vendido')) return;
        const aviso = document.createElement('p');
        aviso.className = 'aviso aviso-vendido';
        aviso.textContent = 'Solo el administrador puede marcarlo vendido. Avísale a D.J. y se actualiza en la página.';
        card.querySelector('.cuerpo').appendChild(aviso);
      };
    }
    lista.appendChild(card);
  });
}

document.getElementById('buscador').addEventListener('input', function(e){
  textoBusqueda = e.target.value;
  pintarLista();
});

function cargarDesdeJSON(){
  return fetch('ofertas.json')
    .then(function(r){ return r.json(); })
    .then(function(data){
      ofertas = (data.ofertas || []).map(function(o){
        return normalizar(o, (o.proveedores && o.proveedores.length) ? 'api' : 'json');
      });
      if(data.whatsapp_pedidos) WHATSAPP_PEDIDOS = data.whatsapp_pedidos;
      pintarChips();
      pintarLista();
    });
}

// Arranque: lee config.json; si hay backend, pide el catálogo ahí;
// si no, usa el ofertas.json local (respaldo).
fetch('config.json')
  .then(function(r){ return r.json(); })
  .catch(function(){ return {}; })
  .then(function(cfg){
    API_URL = (cfg && cfg.api_url) || '';
    if(!API_URL){ return cargarDesdeJSON(); }
    return llamarAPI('catalogo', {})
      .then(function(data){
        if(!data || !data.ok) throw new Error('backend sin respuesta');
        ofertas = (data.ofertas || []).map(function(o){ return normalizar(o, 'api'); });
        if(data.whatsapp_pedidos) WHATSAPP_PEDIDOS = data.whatsapp_pedidos;
        pintarChips();
        pintarLista();
      })
      .catch(function(){ return cargarDesdeJSON(); });
  })
  .catch(function(){
    document.getElementById('lista').innerHTML = '<div class="vacio">No se pudieron cargar las ofertas.<br>Intenta recargar la página.</div>';
  });
</script>
</body>
</html>
