<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IMPACTO · Panel de gestión</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Playfair+Display:ital,wght@1,500;1,600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0A0A;
    --lime:#C6FF3D;
    --card:#141414;
    --panel:#1A1A1A;
    --border:#2A2A2A;
    --text:#FFFFFF;
    --muted:#A3A3A3;
    --faint:#737373;
    --red:#EF4444;
    --red-dim:#DC2626;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
  header{position:sticky;top:0;z-index:40;background:rgba(10,10,10,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);padding:14px 16px}
  header h1{font-size:26px;font-weight:900;letter-spacing:.02em;color:var(--lime)}
  header p{font-size:12px;color:var(--muted);margin-top:2px}
  main{padding:16px;max-width:640px;margin:0 auto}
  .tarjeta{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:20px 16px;margin-top:12px}
  .tarjeta h2{font-size:16px;font-weight:800;text-transform:uppercase;letter-spacing:.02em;color:var(--text);margin-bottom:4px}
  .tarjeta p.sub{font-size:13px;color:var(--muted);line-height:1.55;margin-bottom:10px}
  label{display:block;font-size:12px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);margin-top:14px}
  input,select,textarea{width:100%;height:48px;border:1px solid var(--border);border-radius:12px;padding:0 14px;font-size:15px;font-family:inherit;background:var(--card);color:var(--text);outline:none;margin-top:6px}
  textarea{height:auto;padding:12px 14px;resize:vertical}
  input::placeholder,textarea::placeholder{color:var(--faint)}
  input:focus,select:focus,textarea:focus{border-color:var(--lime)}
  input[type="file"]{padding:10px 12px}
  button{height:48px;border-radius:999px;font-size:13px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;font-family:inherit;cursor:pointer;border:none}
  button:disabled{opacity:.55;cursor:default}
  .btn-primario{background:var(--lime);color:#0A0A0A;width:100%;margin-top:18px}
  .btn-acento{background:var(--lime);color:#0A0A0A;width:100%;margin-top:18px}
  .btn-borde{background:transparent;color:var(--red);border:1px solid var(--red-dim);width:100%;margin-top:12px}
  .btn-chico{height:40px;padding:0 16px;font-size:12px;width:auto;margin-top:0}
  .btn-toggle{height:40px;padding:0 16px;font-size:12px;width:auto;margin-top:0;background:var(--lime);color:#0A0A0A}
  .btn-toggle.agotado{background:var(--red-dim);color:#fff}
  .msg{font-size:13px;line-height:1.5;border-radius:12px;padding:12px 14px;margin-top:12px;border:1px solid var(--border)}
  .msg.error{background:rgba(220,38,38,.12);color:#FCA5A5;border-color:rgba(220,38,38,.45)}
  .msg.ok{background:rgba(198,255,61,.08);color:var(--lime);border-color:var(--border)}
  .msg.info{background:var(--panel);color:var(--muted)}
  .barra{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .barra .quien{font-size:13px;font-weight:700;color:var(--text)}
  .prov{border-top:1px solid var(--border);padding:14px 0}
  .prov .linea{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px}
  .prov .linea input{width:110px;height:40px;margin-top:0}
  .prov .nombre{font-weight:800;font-size:14px;color:var(--text)}
  .prov .detalle{font-size:12px;color:var(--muted);line-height:1.55;margin-top:6px}
  .comision{font-size:12px;font-weight:800;color:var(--lime);background:rgba(198,255,61,.08);border:1px solid var(--border);border-radius:999px;padding:4px 10px}
  .prod-titulo{font-size:15px;font-weight:800;text-transform:uppercase;letter-spacing:.01em;color:var(--text)}
  .prod-sub{font-size:12px;color:var(--faint);margin-top:2px}
  .fila-foto{display:flex;gap:8px;margin-top:8px}
  .fila-foto input{flex:1}
  .fila-foto button{flex:0 0 auto}
  .usuario-fila{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--border);font-size:13px;color:var(--text)}
  .usuario-fila b{font-size:14px}
  .rol-chip{font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;background:var(--panel);border:1px solid var(--border);border-radius:999px;padding:4px 10px;color:var(--muted)}
  footer{text-align:center;color:var(--faint);font-size:12px;line-height:1.7;padding:18px 16px 8px}
  a{color:var(--lime)}
  a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
  .pg-foto{width:100%;max-width:280px;border-radius:16px;border:1px solid var(--border);display:block;margin-top:8px}
  .pg-mini{width:56px;height:56px;object-fit:cover;border-radius:12px;border:2px solid var(--border);cursor:pointer;padding:0;display:block}
  .pg-mini.elegida{border-color:var(--lime)}
  .pg-mini.usada{opacity:.45;filter:grayscale(.6)}
  .pg-minis{display:grid;grid-template-columns:repeat(auto-fill,56px);gap:8px;margin-top:8px}
  .pg-mini-wrap{position:relative;width:56px;height:56px;cursor:pointer;display:block}
  .pg-mini-wrap.elegida::after{content:'✓';position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:var(--lime);color:#0A0A0A;font-size:12px;font-weight:900;display:flex;align-items:center;justify-content:center;border:2px solid #0A0A0A;z-index:1}
  .pg-mini-wrap.usada::before{content:'USADA';position:absolute;bottom:2px;left:2px;right:2px;font-size:8px;font-weight:900;letter-spacing:.03em;text-align:center;background:rgba(10,10,10,.75);color:#fff;border-radius:4px;padding:1px 0;z-index:1}
  .pg-usadas{font-size:11px;color:var(--muted);margin-top:6px}
  .pg-origen{font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;background:var(--panel);border:1px solid var(--border);border-radius:999px;padding:4px 10px;color:var(--lime)}
  .pg-alcance{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}
  .pg-chip{font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;background:var(--panel);border:1px solid var(--border);border-radius:999px;padding:4px 10px;color:var(--muted);cursor:pointer;width:auto;height:auto;margin-top:0}
  .pg-chip.activo{border-color:var(--lime);color:var(--lime)}
  .pg-prod{border-top:1px solid var(--border);padding:16px 0}
  .pg-prov{border:1px solid var(--border);border-radius:16px;padding:12px;margin-top:10px;background:var(--panel)}
  .pg-prov .linea{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
  .pg-prov .linea input,.pg-prov .linea select{flex:1;min-width:100px;height:40px;margin-top:0}
  .pg-prov label{margin-top:8px}
  .pg-nombre{font-weight:800;font-size:14px;color:var(--text)}
  .pg-falta{font-size:12px;font-weight:800;color:#FCA5A5}
  .prod-foto{display:flex;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap}
  .prod-foto .sin-foto{width:56px;height:56px;border-radius:12px;border:2px dashed var(--border);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--faint);text-align:center;padding:4px}
  .cf-editor{margin-top:10px;border:1px solid var(--border);border-radius:16px;padding:12px;background:var(--panel)}
  .cf-editor .fila-foto{margin-top:10px}
</style>
</head>
<body>
<header>
  <h1>IMPACTO · Panel</h1>
  <p>Gestión del catálogo · Solo administradores y gestores</p>
</header>
<main id="app">
  <div class="tarjeta"><p class="sub">Cargando…</p></div>
</main>
<footer>
  <a href="index.html">← Volver al catálogo público</a><br>
  Las claves se guardan cifradas. Nunca compartas la tuya.
</footer>

<script>
const GRUPOS = ["COCINAS","ENERGÍA","LAVADORAS","TV","HORNOS","NEVERAS","REFRIGERADORES","SPLITS","BOCINAS","CAJITAS","FREIDORAS","OLLAS","VENTILADORES","LICUADORAS","BASES","CAFETERAS","LUMINARIA","COLCHONES","TRANSPORTE","OTROS"];
let API_URL = "";
let sesion = null; // {token, usuario, rol, nombre}

function leerSesion(){
  try{
    const t = localStorage.getItem('impacto_token');
    const u = localStorage.getItem('impacto_usuario');
    const r = localStorage.getItem('impacto_rol');
    const n = localStorage.getItem('impacto_nombre');
    if(t && u) sesion = {token: t, usuario: u, rol: r, nombre: n};
  }catch(e){}
}
function guardarSesion(s){
  sesion = s;
  try{
    localStorage.setItem('impacto_token', s.token);
    localStorage.setItem('impacto_usuario', s.usuario);
    localStorage.setItem('impacto_rol', s.rol || '');
    localStorage.setItem('impacto_nombre', s.nombre || s.usuario);
  }catch(e){}
}
function borrarSesion(){
  sesion = null;
  try{ localStorage.clear(); }catch(e){}
}

function llamarAPI(accion, datos){
  datos = datos || {};
  datos.action = accion;
  if(sesion && sesion.token) datos.token = sesion.token;
  return fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(datos),
    redirect: 'follow'
  }).then(function(r){ return r.json(); });
}
function escapar(s){
  return String(s === undefined || s === null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function mensaje(cont, tipo, texto){
  const viejo = cont.querySelector('.msg');
  if(viejo) viejo.remove();
  const d = document.createElement('div');
  d.className = 'msg ' + tipo;
  d.textContent = texto;
  cont.appendChild(d);
}

let vistaPegar = null; // ofertas parseadas en la vista previa (con su foto)
let productosPorId = {}; // productos del panel por id (para el editor de foto)
let editoresFoto = {}; // pid -> {abierto, cargando, datos, mostrarUsadas}
let avisoTrasRecarga = ''; // resumen de la sincronización, se muestra tras recargar el panel

function pgOrigenTexto(foto){
  if(!foto) return 'Sin foto';
  if(foto.origen === 'drive') return 'Drive · vendedor';
  if(foto.origen === 'internet') return 'Internet · referencia';
  return 'Sin foto';
}
// Alcance que permite el motivo: qué campos toca la actualización al
// registrar. Los chips son la autoridad (el backend usa of.alcance si
// viene; sin motivo, todo activo = actualización completa, como siempre).
function pgAlcanceHtml(of){
  var a = of.alcance || { precio: true, caracteristicas: true, proveedores: true, foto: true };
  function chip(clave, texto){
    return '<button type="button" class="pg-chip' + (a[clave] ? ' activo' : '') + '" data-pg-alcance-chip="' + clave + '">' + texto + '</button>';
  }
  var todo = a.precio && a.caracteristicas && a.proveedores && a.foto;
  return '<div class="pg-alcance"><span class="pg-usadas">Alcance:</span>' +
    chip('precio', 'Precio') + chip('caracteristicas', 'Características') +
    chip('proveedores', 'Proveedores') + chip('foto', 'Foto') +
    '<button type="button" class="pg-chip' + (todo ? ' activo' : '') + '" data-pg-alcance-chip="todo">Todo</button></div>';
}
function fotoOrigenDeUrl(url){
  if(!url) return '';
  return String(url).indexOf('drive.google.com') !== -1 ? 'drive' : 'internet';
}
function idDriveDeUrl(url){
  const m = String(url || '').match(/[?&]id=([A-Za-z0-9_-]+)/);
  return m ? m[1] : '';
}
// Moneda de un proveedor: USD/MN/CUP. Si la guardada es otra (p. ej. EUR
// de un mensaje viejo), se añade tal cual para no resetearla sin querer.
function monedaSelectHtml(monedaActual){
  var opciones = ['USD', 'MN', 'CUP'];
  if(opciones.indexOf(monedaActual) === -1) opciones.push(monedaActual);
  return '<select data-campo="moneda" data-moneda-original="' + escapar(monedaActual) + '" aria-label="Moneda">' +
    opciones.map(function(m){ return '<option' + (m === monedaActual ? ' selected' : '') + '>' + m + '</option>'; }).join('') + '</select>';
}

function renderVistaPegar(){
  const vista = document.getElementById('pg-vista');
  if(!vista) return;
  if(!vistaPegar || !vistaPegar.length){ vista.innerHTML = ''; return; }
  let html = '';
  vistaPegar.forEach(function(of, i){
    const foto = of.foto || {};
    html += '<div class="pg-prod" data-pg-prod="' + i + '">' +
      '<label>Tipo<input data-pg="tipo" value="' + escapar(of.tipo || '') + '"></label>' +
      '<label>Modelo<input data-pg="modelo" value="' + escapar(of.modelo || '') + '"></label>' +
      '<label>Características<textarea data-pg="caracteristicas" rows="2">' + escapar(of.caracteristicas || '') + '</textarea></label>';
    html += '<label>Motivo del mensaje<input data-pg="motivo" placeholder="Sin motivo: se actualiza todo" value="' + escapar(of.motivo || '') + '"></label>';
    html += pgAlcanceHtml(of);
    html += '<label>Foto <span class="pg-origen">' + escapar(pgOrigenTexto(foto)) + '</span></label>';
    if(foto.foto_url){
      html += '<img class="pg-foto" src="' + escapar(foto.foto_url) + '" alt="Foto del producto">';
    }
    if(foto.detalle) html += '<p class="sub">' + escapar(foto.detalle) + '</p>';
    var elegidosOtros = {};
    vistaPegar.forEach(function(o2, j){
      if(j !== i && o2.foto && o2.foto.origen === 'drive' && o2.foto.drive_id) elegidosOtros[o2.foto.drive_id] = true;
    });
    var candidatasVisibles = (foto.candidatas || []).filter(function(c){ return !elegidosOtros[c.drive_id]; });
    if(candidatasVisibles.length){
      html += '<div class="pg-minis">' + candidatasVisibles.map(function(c){
        const elegida = foto.drive_id && c.drive_id === foto.drive_id;
        return '<span class="pg-mini-wrap' + (elegida ? ' elegida' : '') + '" data-pg-foto="' + escapar(c.drive_id) + '" data-pg-nombre="' + escapar(c.nombre) + '" data-pg-src="' + escapar(c.foto_url) + '"><img class="pg-mini' + (elegida ? ' elegida' : '') + '" src="' + escapar(c.foto_url) + '" alt="' + escapar(c.nombre) + '"></span>';
      }).join('') + '</div>';
    }
    if(foto.usadas && foto.usadas.length){
      html += '<div class="fila-foto"><button class="btn-chico" data-pg-usadas="' + i + '">' + (of._mostrarUsadas ? 'Ocultar' : 'Mostrar') + ' fotos ya usadas (' + foto.usadas.length + ')</button></div>';
      if(of._mostrarUsadas){
        html += '<p class="pg-usadas">Ya están asignadas a otro producto. Elígela solo si la quieres también aquí.</p><div class="pg-minis">' + foto.usadas.map(function(c){
          const elegida = foto.drive_id && c.drive_id === foto.drive_id;
          return '<span class="pg-mini-wrap usada' + (elegida ? ' elegida' : '') + '" data-pg-foto="' + escapar(c.drive_id) + '" data-pg-nombre="' + escapar(c.nombre) + '" data-pg-src="' + escapar(c.foto_url) + '" title="Ya usada en otro producto"><img class="pg-mini usada' + (elegida ? ' elegida' : '') + '" src="' + escapar(c.foto_url) + '" alt="' + escapar(c.nombre) + ' (usada)"></span>';
        }).join('') + '</div>';
      }
    }
    html += '<div class="fila-foto"><button class="btn-chico btn-toggle" data-pg-buscar-foto="' + i + '">Buscar foto de referencia</button></div>';
    if(foto.opciones && foto.opciones.length > 1){
      html += '<div class="pg-minis">' + foto.opciones.map(function(op, k){
        const elegida = foto.foto_url && op.foto_url === foto.foto_url;
        return '<span class="pg-mini-wrap' + (elegida ? ' elegida' : '') + '" data-pg-opcion="' + k + '"><img class="pg-mini' + (elegida ? ' elegida' : '') + '" src="' + escapar(op.foto_url) + '" title="' + escapar(op.fuente || op.origen || '') + '" alt="Opción ' + (k + 1) + ' de ' + escapar(op.origen || 'Internet') + '"></span>';
      }).join('') + '</div>';
    }
    html += '<label>o pega la dirección de una foto<input data-pg="foto_url" placeholder="https://…" value="' + escapar(foto.origen === 'internet' ? foto.foto_url : '') + '"></label>';
    (of.proveedores || []).forEach(function(sp, j){
      html += '<div class="pg-prov" data-pg-prov="' + j + '">' +
        '<div class="pg-nombre">' + escapar(sp.proveedor || '') + '</div>' +
        (sp.precio ? '' : '<div class="pg-falta">Falta el precio: escríbelo antes de registrar.</div>') +
        '<div class="linea"><input type="number" min="0" step="1" data-pg="precio" value="' + (sp.precio || '') + '" aria-label="Precio"> ' +
        '<select data-pg="moneda"><option' + (sp.moneda === 'USD' ? ' selected' : '') + '>USD</option><option' + (sp.moneda === 'MN' ? ' selected' : '') + '>MN</option></select></div>' +
        '<label>Comisión del gestor</label><div class="linea"><input type="number" min="0" step="1" data-pg="comision" value="' + (sp.comision || 0) + '" aria-label="Comisión"> ' +
        '<select data-pg="comision_moneda"><option' + (sp.comision_moneda === 'MN' ? ' selected' : '') + '>MN</option><option' + (sp.comision_moneda === 'USD' ? ' selected' : '') + '>USD</option></select></div>' +
        '<label>Garantía<input data-pg="garantia" value="' + escapar(sp.garantia || '') + '" placeholder="ej. 7 días"></label>' +
        '<label>Domicilio<input data-pg="domicilio" value="' + escapar(sp.domicilio || '') + '"></label>' +
        '<label>Pago aceptado<input data-pg="pago" value="' + escapar(sp.pago || '') + '"></label>' +
      '</div>';
    });
    html += '</div>';
  });
  vista.innerHTML = html;
  vista.querySelectorAll('[data-pg-foto]').forEach(function(el){
    el.onclick = function(){
      recogerVistaPegar();
      const bloque = el.closest('[data-pg-prod]');
      const i = Number(bloque.getAttribute('data-pg-prod'));
      const of = vistaPegar[i];
      of.foto = {
        foto_url: el.getAttribute('data-pg-src'), foto_tipo: 'vendedor',
        origen: 'drive', drive_id: el.getAttribute('data-pg-foto'),
        nombre_archivo: el.getAttribute('data-pg-nombre'),
        detalle: 'Elegida de Drive: ' + el.getAttribute('data-pg-nombre'),
        candidatas: (of.foto && of.foto.candidatas) || [],
        usadas: (of.foto && of.foto.usadas) || [],
        opciones: (of.foto && of.foto.opciones) || []
      };
      renderVistaPegar();
    };
  });
  vista.querySelectorAll('[data-pg-buscar-foto]').forEach(function(btn){
    btn.onclick = function(){
      recogerVistaPegar();
      const i = Number(btn.getAttribute('data-pg-buscar-foto'));
      const of = vistaPegar[i];
      const global = document.getElementById('msg-global');
      btn.disabled = true;
      btn.textContent = 'Buscando fotos…';
      mensaje(global, 'info', 'Buscando fotos de referencia en internet…');
      llamarAPI('foto_automatica', {grupo: of.grupo, tipo: of.tipo, modelo: of.modelo}).then(function(r){
        if(!r.ok){ mensaje(global, 'error', r.error || 'No se encontró foto.'); renderVistaPegar(); return; }
        of.foto = r;
        renderVistaPegar();
        mensaje(global, r.origen === 'internet' ? 'ok' : 'info', r.detalle || 'Foto actualizada.');
      }).catch(function(){ mensaje(global, 'error', 'No se pudo hablar con el backend.'); renderVistaPegar(); });
    };
  });
  vista.querySelectorAll('[data-pg-opcion]').forEach(function(el){
    el.onclick = function(){
      recogerVistaPegar();
      const bloque = el.closest('[data-pg-prod]');
      const i = Number(bloque.getAttribute('data-pg-prod'));
      const of = vistaPegar[i];
      const k = Number(el.getAttribute('data-pg-opcion'));
      const op = (of.foto && of.foto.opciones && of.foto.opciones[k]) || null;
      if(!op) return;
      of.foto = {
        foto_url: op.foto_url, foto_tipo: 'referencia', origen: 'internet',
        detalle: 'Referencia de Internet (' + (op.origen || 'Internet') + '): elegida de las opciones.',
        candidatas: (of.foto && of.foto.candidatas) || [],
        usadas: (of.foto && of.foto.usadas) || [],
        opciones: (of.foto && of.foto.opciones) || []
      };
      renderVistaPegar();
    };
  });
  vista.querySelectorAll('[data-pg-usadas]').forEach(function(btn){
    btn.onclick = function(){
      recogerVistaPegar();
      const i = Number(btn.getAttribute('data-pg-usadas'));
      const of = vistaPegar[i];
      of._mostrarUsadas = !of._mostrarUsadas;
      renderVistaPegar();
    };
  });
  vista.querySelectorAll('[data-pg="foto_url"]').forEach(function(inp){
    inp.onchange = function(){
      recogerVistaPegar();
      const bloque = inp.closest('[data-pg-prod]');
      const i = Number(bloque.getAttribute('data-pg-prod'));
      const url = inp.value.trim();
      if(!url) return;
      vistaPegar[i].foto = {
        foto_url: url, foto_tipo: 'referencia', origen: 'internet',
        detalle: 'Foto pegada a mano (referencia).',
        candidatas: (vistaPegar[i].foto && vistaPegar[i].foto.candidatas) || [],
        usadas: (vistaPegar[i].foto && vistaPegar[i].foto.usadas) || [],
        opciones: (vistaPegar[i].foto && vistaPegar[i].foto.opciones) || []
      };
      renderVistaPegar();
    };
  });
  // Chips de alcance: tocan of.alcance y re-renderizan (recogerVistaPegar
  // antes, como el resto de controles, para no perder lo editado).
  vista.querySelectorAll('[data-pg-alcance-chip]').forEach(function(el){
    el.onclick = function(){
      recogerVistaPegar();
      const bloque = el.closest('[data-pg-prod]');
      const i = Number(bloque.getAttribute('data-pg-prod'));
      const of = vistaPegar[i];
      if(!of) return;
      if(!of.alcance) of.alcance = { precio: true, caracteristicas: true, proveedores: true, foto: true };
      const clave = el.getAttribute('data-pg-alcance-chip');
      if(clave === 'todo'){
        of.alcance = { precio: true, caracteristicas: true, proveedores: true, foto: true };
      } else {
        of.alcance[clave] = !of.alcance[clave];
      }
      renderVistaPegar();
    };
  });
}

function recogerVistaPegar(){
  if(!vistaPegar) return [];
  const vista = document.getElementById('pg-vista');
  if(!vista) return vistaPegar;
  vista.querySelectorAll('[data-pg-prod]').forEach(function(bloque){
    const i = Number(bloque.getAttribute('data-pg-prod'));
    const of = vistaPegar[i];
    if(!of) return;
    bloque.querySelectorAll('[data-pg="tipo"],[data-pg="modelo"],[data-pg="caracteristicas"],[data-pg="motivo"]').forEach(function(inp){
      of[inp.getAttribute('data-pg')] = inp.value.trim();
    });
    // Sin motivo no hay alcance parcial: se borra el tipo y se abre todo,
    // como hace el backend cuando no trae motivo.
    if(!of.motivo){
      of.motivo_tipo = '';
      of.alcance = { precio: true, caracteristicas: true, proveedores: true, foto: true };
    }
    const urlInput = bloque.querySelector('[data-pg="foto_url"]');
    if(urlInput && urlInput.value.trim() && (!of.foto || of.foto.origen !== 'drive') && urlInput.value.trim() !== (of.foto && of.foto.foto_url)){
      of.foto = { foto_url: urlInput.value.trim(), foto_tipo: 'referencia', origen: 'internet', detalle: 'Foto pegada a mano (referencia).', candidatas: (of.foto && of.foto.candidatas) || [], usadas: (of.foto && of.foto.usadas) || [], opciones: (of.foto && of.foto.opciones) || [] };
    }
    bloque.querySelectorAll('[data-pg-prov]').forEach(function(pb){
      const j = Number(pb.getAttribute('data-pg-prov'));
      const sp = of.proveedores[j];
      if(!sp) return;
      sp.precio = Number(pb.querySelector('[data-pg="precio"]').value) || 0;
      sp.moneda = pb.querySelector('[data-pg="moneda"]').value;
      sp.moneda_explicita = true;
      sp.comision = Number(pb.querySelector('[data-pg="comision"]').value) || 0;
      sp.comision_moneda = pb.querySelector('[data-pg="comision_moneda"]').value;
      sp.comision_moneda_explicita = true;
      sp.garantia = pb.querySelector('[data-pg="garantia"]').value.trim();
      sp.domicilio = pb.querySelector('[data-pg="domicilio"]').value.trim();
      sp.pago = pb.querySelector('[data-pg="pago"]').value.trim();
    });
  });
  // La foto de Drive va directa; la de internet se descarga a Drive al
  // registrar (foto_descargar). El motivo y su alcance van tal cual se ven
  // en la vista previa: sin ellos el backend caía a actualización completa.
  return vistaPegar.map(function(of){
    const foto = of.foto || {};
    return {
      grupo: of.grupo, tipo: of.tipo, modelo: of.modelo,
      caracteristicas: of.caracteristicas,
      motivo: of.motivo || '', motivo_tipo: of.motivo_tipo || '',
      alcance: of.alcance || { precio: true, caracteristicas: true, proveedores: true, foto: true },
      texto_original: of.texto_original || '',
      foto_url: foto.foto_url || '', foto_tipo: foto.foto_tipo || 'referencia',
      foto_origen: foto.origen || 'ninguno', foto_descargar: foto.origen === 'internet',
      foto_drive_id: foto.drive_id || idDriveDeUrl(foto.foto_url) || '',
      foto_nombre_archivo: foto.nombre_archivo || '',
      proveedores: of.proveedores || []
    };
  });
}

// ---- Cambiar foto de un producto ya registrado ----
// Abre el selector (mismo que en Pegar ofertas: miniaturas de Drive,
// fotos ya usadas, referencias de internet y URL manual) debajo del
// producto. Elegir una foto la guarda con la acción cambiar_foto y
// recarga el panel: no borra el producto ni toca precios ni proveedores.
function abrirEditorFoto(pid){
  const p = productosPorId[pid];
  if(!p) return;
  const ed = document.querySelector('[data-cf-editor="' + pid + '"]');
  if(!ed) return;
  editoresFoto[pid] = {abierto: true, cargando: true, datos: null, mostrarUsadas: false};
  ed.style.display = '';
  ed.innerHTML = '<p class="sub">Buscando fotos en Drive y en internet…</p>';
  llamarAPI('foto_automatica', {grupo: p.grupo, tipo: p.tipo, modelo: p.modelo || ''}).then(function(r){
    const est = editoresFoto[pid];
    if(!est || !est.abierto) return;
    est.cargando = false;
    if(!r.ok){
      ed.innerHTML = '<p class="sub">' + escapar(r.error || 'No se pudo buscar fotos.') + '</p>' +
        '<div class="fila-foto"><button class="btn-chico" data-cf-cerrar="' + pid + '">Cerrar</button></div>';
      enlazarEditorFoto(pid);
      return;
    }
    est.datos = r;
    renderEditorFoto(pid);
  }).catch(function(){
    const est = editoresFoto[pid];
    if(!est || !est.abierto) return;
    est.cargando = false;
    ed.innerHTML = '<p class="sub">No se pudo hablar con el backend.</p>' +
      '<div class="fila-foto"><button class="btn-chico" data-cf-cerrar="' + pid + '">Cerrar</button></div>';
    enlazarEditorFoto(pid);
  });
}

function renderEditorFoto(pid){
  const p = productosPorId[pid];
  const est = editoresFoto[pid];
  const ed = document.querySelector('[data-cf-editor="' + pid + '"]');
  if(!p || !est || !ed) return;
  const d = est.datos || {};
  const actualId = idDriveDeUrl(p.foto_url);
  let html = '<label>Cambiar foto · ' + escapar(p.tipo + ' ' + (p.modelo || '')) + '</label>';
  if(d.detalle) html += '<p class="sub">' + escapar(d.detalle) + '</p>';
  const candidatas = d.candidatas || [];
  if(candidatas.length){
    html += '<p class="sub">Fotos de Drive (carpeta ' + escapar(p.grupo) + '):</p><div class="pg-minis">' + candidatas.map(function(c){
      return '<span class="pg-mini-wrap" data-cf-drive="' + escapar(c.drive_id) + '" title="' + escapar(c.nombre) + '"><img class="pg-mini" src="' + escapar(c.foto_url) + '" alt="' + escapar(c.nombre) + '"></span>';
    }).join('') + '</div>';
  }
  const usadas = d.usadas || [];
  if(usadas.length){
    html += '<div class="fila-foto"><button class="btn-chico" data-cf-usadas="' + pid + '">' + (est.mostrarUsadas ? 'Ocultar' : 'Mostrar') + ' fotos ya usadas (' + usadas.length + ')</button></div>';
    if(est.mostrarUsadas){
      html += '<p class="pg-usadas">Ya están asignadas a otro producto. Elígela solo si la quieres también aquí.</p><div class="pg-minis">' + usadas.map(function(c){
        const esActual = actualId && c.drive_id === actualId;
        return '<span class="pg-mini-wrap usada' + (esActual ? ' elegida' : '') + '" data-cf-drive="' + escapar(c.drive_id) + '" title="' + escapar(c.nombre) + (esActual ? ' (foto actual)' : ' (ya usada en otro producto)') + '"><img class="pg-mini usada' + (esActual ? ' elegida' : '') + '" src="' + escapar(c.foto_url) + '" alt="' + escapar(c.nombre) + '"></span>';
      }).join('') + '</div>';
    }
  }
  if(!candidatas.length && !usadas.length){
    html += '<p class="sub">No hay fotos en Drive para este grupo.</p>';
  }
  const opciones = d.opciones || [];
  if(opciones.length){
    html += '<p class="sub">Referencias de internet:</p><div class="pg-minis">' + opciones.map(function(op, k){
      return '<span class="pg-mini-wrap" data-cf-opcion="' + k + '" title="' + escapar(op.fuente || op.origen || '') + '"><img class="pg-mini" src="' + escapar(op.foto_url) + '" alt="Opción ' + (k + 1) + ' de ' + escapar(op.origen || 'Internet') + '"></span>';
    }).join('') + '</div>';
  }
  html += '<div class="fila-foto"><button class="btn-chico btn-toggle" data-cf-buscar="' + pid + '">Buscar foto de referencia</button></div>';
  html += '<label>o pega la dirección de una foto<input data-cf-url placeholder="https://…"></label>' +
    '<div class="fila-foto"><button class="btn-chico btn-toggle" data-cf-guardar-url="' + pid + '">Guardar foto desde la web</button>' +
    '<button class="btn-chico" data-cf-cerrar="' + pid + '">Cerrar</button></div>';
  ed.innerHTML = html;
  enlazarEditorFoto(pid);
}

function enlazarEditorFoto(pid){
  const ed = document.querySelector('[data-cf-editor="' + pid + '"]');
  if(!ed) return;
  ed.querySelectorAll('[data-cf-drive]').forEach(function(el){
    el.onclick = function(){ guardarFotoProducto(pid, {drive_id: el.getAttribute('data-cf-drive')}); };
  });
  ed.querySelectorAll('[data-cf-opcion]').forEach(function(el){
    el.onclick = function(){
      const est = editoresFoto[pid];
      const op = est && est.datos && est.datos.opciones && est.datos.opciones[Number(el.getAttribute('data-cf-opcion'))];
      if(!op) return;
      guardarFotoProducto(pid, {image_url: op.foto_url});
    };
  });
  ed.querySelectorAll('[data-cf-usadas]').forEach(function(btn){
    btn.onclick = function(){
      editoresFoto[pid].mostrarUsadas = !editoresFoto[pid].mostrarUsadas;
      renderEditorFoto(pid);
    };
  });
  ed.querySelectorAll('[data-cf-buscar]').forEach(function(btn){
    btn.onclick = function(){ abrirEditorFoto(pid); };
  });
  ed.querySelectorAll('[data-cf-guardar-url]').forEach(function(btn){
    btn.onclick = function(){
      const inp = ed.querySelector('[data-cf-url]');
      const url = inp ? inp.value.trim() : '';
      const global = document.getElementById('msg-global');
      if(!url){ mensaje(global, 'error', 'Pega primero la dirección de la foto.'); return; }
      guardarFotoProducto(pid, {image_url: url});
    };
  });
  ed.querySelectorAll('[data-cf-cerrar]').forEach(function(btn){
    btn.onclick = function(){
      editoresFoto[pid] = {abierto: false};
      ed.style.display = 'none';
      ed.innerHTML = '';
    };
  });
}

function guardarFotoProducto(pid, foto){
  const global = document.getElementById('msg-global');
  const datos = {producto_id: pid};
  if(foto.drive_id) datos.drive_id = foto.drive_id;
  if(foto.image_url) datos.image_url = foto.image_url;
  mensaje(global, 'info', 'Cambiando la foto…');
  llamarAPI('cambiar_foto', datos).then(function(r){
    if(!r.ok){ mensaje(global, 'error', r.error || 'No se pudo cambiar la foto.'); return; }
    mensaje(global, 'ok', 'Foto cambiada.');
    editoresFoto[pid] = {abierto: false};
    cargarPanel();
  }).catch(function(){ mensaje(global, 'error', 'No se pudo hablar con el backend.'); });
}

    div.className = 'prov';
    productosPorId[p.id] = p;
    let h = '<div class="prod-titulo">' + escapar(p.tipo) + ' ' + escapar(p.modelo) + '</div>' +
      '<div class="prod-sub">' + escapar(p.grupo) + ' · Foto: ' + escapar(p.foto_tipo || 'referencia') + '</div>';
    h += '<div class="prod-foto">' +
      (p.foto_url
        ? '<img class="pg-mini" src="' + escapar(p.foto_url) + '" alt="Foto actual"' + (esAdmin ? ' data-cambiar-foto="' + p.id + '" title="Toca para cambiar la foto"' : '') + '>'
        : '<span class="sin-foto">Sin foto</span>') +
      '<span class="pg-origen">' + escapar(pgOrigenTexto({origen: fotoOrigenDeUrl(p.foto_url)})) + '</span>' +
      (esAdmin ? '<button class="btn-chico" data-cambiar-foto="' + p.id + '">Cambiar foto</button>' : '') +
      (esAdmin ? '<button class="btn-chico btn-toggle' + (String(p.estado || 'disponible') === 'vendido' ? ' agotado' : '') + '" data-estado-prod="' + p.id + '">' + (String(p.estado || 'disponible') === 'vendido' ? 'No disponible' : 'Disponible ✓') + '</button>' : '') +
      '</div>' +
      (esAdmin ? '<div class="cf-editor" data-cf-editor="' + p.id + '" style="display:none"></div>' : '');
    if(!provs.length) h += '<p class="sub">Sin proveedores todavía.</p>';
    provs.forEach(function(s){
      h += '<div class="prov" data-prov="' + s.id + '">' +
        '<div class="nombre">' + escapar(s.proveedor) + (s.gestor_usuario ? ' · gestor: ' + escapar(s.gestor_usuario) : '') + '</div>' +
        '<div class="linea">' +
          '<input type="number" min="0" step="1" value="' + s.precio + '" data-campo="precio" aria-label="Precio"> ' +
          (esAdmin ? monedaSelectHtml(s.moneda) : escapar(s.moneda)) +
          '<button class="btn-chico btn-toggle" data-accion="precio">Guardar precio</button>' +
          '<button class="btn-chico btn-toggle' + (s.stock_disponible ? '' : ' agotado') + '" data-accion="stock">' + (s.stock_disponible ? 'Disponible ✓' : 'Agotado') + '</button>' +
        '</div>' +
        '<div class="detalle">Comisión: <span class="comision">' + s.comision + ' ' + escapar(s.comision_moneda || 'MN') + '</span>' +
        (s.domicilio ? ' · Domicilio: ' + escapar(s.domicilio) : '') +
        (s.garantia ? ' · Garantía: ' + escapar(s.garantia) : '') +
        (s.pago ? ' · Pago: ' + escapar(s.pago) : '') +
        (s.notas_internas ? '<br>Nota: ' + escapar(s.notas_internas) : '') + '</div>' +
      '</div>';
    });
    div.innerHTML = h;
    lista.appendChild(div);
  });

  // Acciones de precio y stock
  lista.querySelectorAll('[data-accion]').forEach(function(btn){
    btn.onclick = function(){
      const fila = btn.closest('[data-prov]');
      const id = fila.getAttribute('data-prov');
      const acc = btn.getAttribute('data-accion');
      const global = document.getElementById('msg-global');
      if(acc === 'precio'){
        const val = Number(fila.querySelector('[data-campo="precio"]').value);
        if(!val || val <= 0){ mensaje(global, 'error', 'Escribe un precio mayor que 0.'); return; }
        // Solo el admin ve el selector de moneda (el gestor no puede
        // cambiarla en el backend: se ignoraría sin avisar). El importe no
        // se toca: solo viaja la moneda elegida.
        const datosPrecio = {id: id, precio: val};
        const selMoneda = fila.querySelector('[data-campo="moneda"]');
        const monedaNueva = selMoneda ? selMoneda.value : null;
        const monedaCambiada = monedaNueva && selMoneda.getAttribute('data-moneda-original') !== monedaNueva;
        if(monedaNueva) datosPrecio.moneda = monedaNueva;
        llamarAPI('update_proveedor', datosPrecio).then(function(r){
          if(!r.ok){ mensaje(global, 'error', r.error || 'No se pudo guardar el precio.'); return; }
          mensaje(global, 'ok', monedaCambiada ? ('Moneda corregida a ' + monedaNueva + '. El importe no cambió.') : 'Precio actualizado.');
        }).catch(function(){ mensaje(global, 'error', 'No se pudo hablar con el backend.'); });
      } else {
        const esDisponible = btn.textContent.indexOf('Disponible') === 0;
        llamarAPI('set_stock', {proveedor_id: id, disponible: !esDisponible}).then(function(r){
          if(!r.ok){ mensaje(global, 'error', r.error || 'No se pudo cambiar el stock.'); return; }
          cargarPanel();
        }).catch(function(){ mensaje(global, 'error', 'No se pudo hablar con el backend.'); });
      }
    };
  });

  // Estado del producto (solo admin): disponible / no disponible.
  // update_producto ya existe y es solo de admin; el catálogo público
  // respeta el estado propio del producto.
  lista.querySelectorAll('[data-estado-prod]').forEach(function(btn){
    btn.onclick = function(){
      const pid = btn.getAttribute('data-estado-prod');
      const global = document.getElementById('msg-global');
      const esDisponible = btn.textContent.indexOf('Disponible') === 0;
      const nuevo = esDisponible ? 'vendido' : 'disponible';
      mensaje(global, 'info', esDisponible ? 'Marcando el producto como no disponible…' : 'Marcando el producto como disponible…');
      llamarAPI('update_producto', {id: pid, estado: nuevo}).then(function(r){
        if(!r.ok){ mensaje(global, 'error', r.error || 'No se pudo cambiar el estado.'); return; }
        mensaje(global, 'ok', esDisponible ? 'Producto marcado como no disponible.' : 'Producto marcado como disponible.');
        cargarPanel();
      }).catch(function(){ mensaje(global, 'error', 'No se pudo hablar con el backend.'); });
    };
  });

  // Cambiar foto (miniatura por producto, solo admin)
  lista.querySelectorAll('[data-cambiar-foto]').forEach(function(el){
    el.onclick = function(){
      const pid = el.getAttribute('data-cambiar-foto');
      const ed = document.querySelector('[data-cf-editor="' + pid + '"]');
      const est = editoresFoto[pid];
      if(est && est.abierto){
        editoresFoto[pid] = {abierto: false};
        if(ed){ ed.style.display = 'none'; ed.innerHTML = ''; }
        return;
      }
      abrirEditorFoto(pid);
    };
  });

  if(esAdmin){
    // Selectores de producto
    const opciones = datos.productos.map(function(p){
      return '<option value="' + p.id + '">' + escapar(p.tipo) + ' ' + escapar(p.modelo) + '</option>';
    }).join('');
    document.getElementById('f-producto').innerHTML = opciones;
    document.getElementById('pr-producto').innerHTML = opciones;

    // Guardar foto desde URL
    document.getElementById('f-guardar-url').onclick = function(){
      const global = document.getElementById('msg-global');
      const pid = document.getElementById('f-producto').value;
      const url = document.getElementById('f-url').value.trim();
      const tipo = document.getElementById('f-tipo').value;
      if(!url){ mensaje(global, 'error', 'Pega primero la dirección de la foto.'); return; }
      mensaje(global, 'info', 'Descargando la foto y guardándola en Drive…');
      llamarAPI('guardar_foto_url', {producto_id: pid, image_url: url, foto_tipo: tipo}).then(function(r){
        if(!r.ok){ mensaje(global, 'error', r.error || 'No se pudo guardar la foto.'); return; }
        mensaje(global, 'ok', 'Foto guardada en Drive y puesta en el producto.');
      }).catch(function(){ mensaje(global, 'error', 'No se pudo hablar con el backend.'); });
    };

    // Subir foto desde el teléfono
    document.getElementById('f-subir').onclick = function(){
      const global = document.getElementById('msg-global');
      const pid = document.getElementById('f-producto').value;
      const tipo = document.getElementById('f-tipo').value;
      const input = document.getElementById('f-archivo');
      if(!input.files || !input.files[0]){ mensaje(global, 'error', 'Elige primero una foto del teléfono.'); return; }
      const archivo = input.files[0];
      const lector = new FileReader();
      lector.onload = function(){
        const base64 = String(lector.result).split(',')[1];
        mensaje(global, 'info', 'Subiendo la foto a Drive…');
        llamarAPI('subir_foto', {producto_id: pid, base64: base64, mime: archivo.type, nombre: archivo.name, foto_tipo: tipo}).then(function(r){
          if(!r.ok){ mensaje(global, 'error', r.error || 'No se pudo subir la foto.'); return; }
          mensaje(global, 'ok', 'Foto subida a Drive y puesta en el producto.');
          input.value = '';
        }).catch(function(){ mensaje(global, 'error', 'No se pudo hablar con el backend.'); });
      };
      lector.readAsDataURL(archivo);
    };

    // Añadir producto
    document.getElementById('p-boton').onclick = function(){
      const global = document.getElementById('msg-global');
      const grupo = document.getElementById('p-grupo').value;
      const tipo = document.getElementById('p-tipo').value.trim();
      const modelo = document.getElementById('p-modelo').value.trim();
      if(!tipo || !modelo){ mensaje(global, 'error', 'Escribe el tipo y el modelo.'); return; }
      llamarAPI('add_producto', {
        grupo: grupo, tipo: tipo, modelo: modelo,
        caracteristicas: document.getElementById('p-carac').value.trim(),
        foto_url: document.getElementById('p-foto').value.trim()
      }).then(function(r){
        if(!r.ok){ mensaje(global, 'error', r.error || 'No se pudo añadir el producto.'); return; }
        mensaje(global, 'ok', 'Producto añadido.');
        cargarPanel();
      }).catch(function(){ mensaje(global, 'error', 'No se pudo hablar con el backend.'); });
    };

    // Añadir proveedor
    document.getElementById('pr-boton').onclick = function(){
      const global = document.getElementById('msg-global');
      const precio = Number(document.getElementById('pr-precio').value);
      const nombre = document.getElementById('pr-nombre').value.trim();
      if(!nombre || !precio || precio <= 0){ mensaje(global, 'error', 'Escribe el proveedor y un precio mayor que 0.'); return; }
      llamarAPI('add_proveedor', {
        producto_id: document.getElementById('pr-producto').value,
        proveedor: nombre,
        gestor_usuario: document.getElementById('pr-gestor').value.trim().toLowerCase(),
        precio: precio,
        moneda: document.getElementById('pr-moneda').value,
        pago: document.getElementById('pr-pago').value.trim(),
        comision: Number(document.getElementById('pr-comision').value) || 0,
        comision_moneda: document.getElementById('pr-comision-moneda').value,
        domicilio: document.getElementById('pr-domicilio').value.trim(),
        garantia: document.getElementById('pr-garantia').value.trim(),
        notas_internas: document.getElementById('pr-notas').value.trim(),
        stock_disponible: true
      }).then(function(r){
        if(!r.ok){ mensaje(global, 'error', r.error || 'No se pudo añadir el proveedor.'); return; }
        mensaje(global, 'ok', 'Proveedor añadido.');
        cargarPanel();
      }).catch(function(){ mensaje(global, 'error', 'No se pudo hablar con el backend.'); });
    };

    // Usuarios
    llamarAPI('listar_usuarios', {}).then(function(r){
      if(!r.ok) return;
      const cont = document.getElementById('lista-usuarios');
      if(!cont) return;
      cont.innerHTML = (r.usuarios || []).map(function(u){
        return '<div class="usuario-fila"><span><b>' + escapar(u.nombre) + '</b> · ' + escapar(u.usuario) + '</span><span class="rol-chip">' + escapar(u.rol) + '</span></div>';
      }).join('') || '<p class="sub">No hay usuarios.</p>';
    }).catch(function(){});

    document.getElementById('u-boton').onclick = function(){
      const global = document.getElementById('msg-global');
      const u = document.getElementById('u-usuario').value.trim().toLowerCase();
      const n = document.getElementById('u-nombre').value.trim();
      const rol = document.getElementById('u-rol').value;
      const c = document.getElementById('u-clave').value;
      if(!u || !n || !c){ mensaje(global, 'error', 'Completa usuario, nombre y clave.'); return; }
      if(c.length < 8){ mensaje(global, 'error', 'La clave debe tener al menos 8 caracteres.'); return; }
      llamarAPI('crear_usuario', {usuario: u, nombre: n, rol: rol, clave: c}).then(function(r){
        if(!r.ok){ mensaje(global, 'error', r.error || 'No se pudo crear el usuario.'); return; }
        mensaje(global, 'ok', 'Usuario creado. Pásale su usuario y su clave.');
        cargarPanel();
      }).catch(function(){ mensaje(global, 'error', 'No se pudo hablar con el backend.'); });
    };

    // Pegar ofertas
    document.getElementById('pg-procesar').onclick = function(){
      const global = document.getElementById('msg-global');
      const texto = document.getElementById('pg-texto').value.trim();
      const grupo = document.getElementById('pg-grupo').value;
      const vista = document.getElementById('pg-vista');
      if(!texto){ mensaje(global, 'error', 'Pega primero los mensajes.'); return; }
      mensaje(global, 'info', 'Procesando mensajes…');
      llamarAPI('parse_ofertas', {texto: texto, grupo: grupo}).then(function(r){
        if(!r.ok){ mensaje(global, 'error', r.error || 'No se pudieron procesar los mensajes.'); return; }
        vistaPegar = r.ofertas || [];
        if(!vistaPegar.length){
          mensaje(global, 'error', 'No se encontró ningún producto en el texto. Revisa el formato.');
          vista.innerHTML = '';
          document.getElementById('pg-registrar').style.display = 'none';
          return;
        }
        let aviso = r.mensajes + ' mensaje(s) · ' + vistaPegar.length + ' producto(s). Revisa y corrige antes de registrar.';
        if(r.sin_producto && r.sin_producto.length) aviso += ' ' + r.sin_producto.length + ' mensaje(s) sin producto no se procesaron.';
        mensaje(global, 'ok', aviso);
        renderVistaPegar();
        document.getElementById('pg-registrar').style.display = '';
      }).catch(function(){ mensaje(global, 'error', 'No se pudo hablar con el backend.'); });
    };

    document.getElementById('pg-registrar').onclick = function(){
      const global = document.getElementById('msg-global');
      if(!vistaPegar || !vistaPegar.length) return;
      const ofertas = recogerVistaPegar();
      mensaje(global, 'info', 'Registrando ofertas…');
      llamarAPI('registrar_ofertas', {ofertas: ofertas}).then(function(r){
        if(!r.ok){ mensaje(global, 'error', r.error || 'No se pudieron registrar las ofertas.'); return; }
        let t = 'Registrado: ' + r.productos_creados + ' producto(s) nuevo(s), ' + r.productos_actualizados + ' actualizado(s), ' + r.proveedores_creados + ' proveedor(es) nuevo(s), ' + r.proveedores_actualizados + ' actualizado(s).';
        if(r.omitidos && r.omitidos.length) t += ' Omitidos: ' + r.omitidos.map(function(o){ return o.producto + (o.proveedor ? ' · ' + o.proveedor : '') + ' (' + o.motivo + ')'; }).join('; ');
        mensaje(global, 'ok', t);
        vistaPegar = null;
        document.getElementById('pg-vista').innerHTML = '';
        document.getElementById('pg-registrar').style.display = 'none';
        document.getElementById('pg-texto').value = '';
        cargarPanel();
      }).catch(function(){ mensaje(global, 'error', 'No se pudo hablar con el backend.'); });
    };

    // Sincronizar ahora
    document.getElementById('btn-sincronizar').onclick = function(){
      const global = document.getElementById('msg-global');
      const btn = document.getElementById('btn-sincronizar');
      btn.disabled = true;
      btn.textContent = 'Sincronizando…';
      mensaje(global, 'info', 'Sincronizando fotos de Drive e internet…');
      llamarAPI('sincronizar_ahora', {}).then(function(r){
        if(!r.ok){
          mensaje(global, 'error', r.error || 'No se pudo sincronizar.');
          btn.disabled = false;
          btn.textContent = 'Sincronizar ahora';
          return;
        }
        let t = r.revisados + ' producto(s) revisado(s) · ' + r.fotos_drive + ' foto(s) de Drive · ' + r.fotos_internet + ' de internet · ' + r.sin_foto + ' sin foto';
        if(r.etiquetas_reparadas) t += ' · ' + r.etiquetas_reparadas + ' etiqueta(s) reparada(s)';
        if(r.errores && r.errores.length) t += '. Sin foto: ' + r.errores.map(function(e){ return e.producto + ' (' + e.motivo + ')'; }).join('; ');
        avisoTrasRecarga = t;
        cargarPanel();
      }).catch(function(){
        mensaje(global, 'error', 'No se pudo hablar con el backend.');
        btn.disabled = false;
        btn.textContent = 'Sincronizar ahora';
      });
    };
  }
}

function cargarPanel(){
  const app = document.getElementById('app');
  llamarAPI('datos_gestion', {}).then(function(r){
    if(!r.ok){
      if((r.error || '').indexOf('Sesión') !== -1){ borrarSesion(); vistaLogin(false); return; }
      app.innerHTML = '<div class="tarjeta"><h2>No se pudo cargar el panel</h2><p class="sub">' + escapar(r.error || 'Error desconocido.') + '</p></div>';
      return;
    }
    vistaPanel(r);
    if(avisoTrasRecarga){
      const global = document.getElementById('msg-global');
      if(global) mensaje(global, 'ok', avisoTrasRecarga);
      avisoTrasRecarga = '';
    }
  }).catch(function(){
    app.innerHTML = '<div class="tarjeta"><h2>Sin conexión con el backend</h2><p class="sub">No se pudo hablar con el Apps Script. Revisa la conexión e inténtalo de nuevo.</p></div>';
  });
}

function arrancar(){
  leerSesion();
  fetch('config.json')
    .then(function(r){ return r.json(); })
    .catch(function(){ return {}; })
    .then(function(cfg){
      API_URL = (cfg && cfg.api_url) || '';
      if(!API_URL){ vistaSinBackend(); return; }
      if(sesion && sesion.token){ cargarPanel(); return; }
      fetch(API_URL + '?action=estado', {redirect: 'follow'})
        .then(function(r){ return r.json(); })
        .then(function(est){
          vistaLogin(!est.usuarios_configurados);
        })
        .catch(function(){ vistaLogin(false); });
    });
}
arrancar();
</script>
</body>
</html>
